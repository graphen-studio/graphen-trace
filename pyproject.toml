[project]
name = "graphen-trace"
version = "0.1.0"
description = "Local dashboard for observing coding agent activity"
authors = [
    {name = "Adilson Pavan",email = "adilson.pavan@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "cleo (>=2.1.0,<3.0.0)",
    "fastapi (>=0.143.2,<0.144.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.12.0,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)"
]

[tool.poetry]
packages = [{ include = "graphen_trace" }]
include = [{ path = "graphen_trace/web/dist/**", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pylint = "^3.3.0"

[project.scripts]
graphen-trace = "graphen_trace.__main__:main"

[tool.black]
line-length = 88

[tool.pylint.main]
max-line-length = 88


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
